plugins { id 'com.android.application' }

android {
    namespace 'local.boox.calendarclock'
    compileSdk 35

    defaultConfig {
        // Keep the prototype's ID so an existing installation can be upgraded.
        applicationId 'local.boox.calendarclock'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    buildFeatures { buildConfig true }
    bundle { language { enableSplit = false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'previewDir', layout.buildDirectory.dir('outputs/previews').get().asFile.absolutePath
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
